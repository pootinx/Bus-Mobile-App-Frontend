name: bus_app
description: "to bus tracking app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_dotenv: ^5.2.1
  flutter_typeahead: ^5.2.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  flutter_polyline_points: ^3.1.0
  url_launcher: ^6.3.1
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.3
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  flutter_keyboard_visibility: ^6.0.0
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0
  sliding_up_panel: ^2.0.0
  flutter_svg: ^2.2.0
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.4
  internet_connection_checker: ^3.0.1
  google_maps_flutter: ^2.12.3



  # file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/gtfs_lines_nested.json   # ✅ Fichier JSON des lignes
    - assets/casa.json   # ✅ Fichier JSON des lignes

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  background_color: "#FF0000"
  adaptive_icon_background: "#FF0000"
