name: bus_app
description: "to bus tracking app"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_dotenv: ^5.2.1
  flutter_typeahead: ^5.2.0
  latlong2: ^0.9.1
  flutter_polyline_points: ^3.1.0
  url_launcher: ^6.3.1
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.3
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  flutter_keyboard_visibility: ^6.0.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_crashlytics: ^4.1.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^18.0.1
  sliding_up_panel: ^2.0.0
  flutter_svg: ^2.2.0
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.4
  internet_connection_checker: ^3.0.1
  google_maps_flutter: ^2.12.3
  lottie: ^3.1.2
  get: ^4.6.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  nested: ^1.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  animations: ^2.0.11
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/gtfs_lines_nested.json
    - assets/casa.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  background_color: "#FF0000"
  adaptive_icon_background: "#FF0000"
